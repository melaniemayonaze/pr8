name: API CI/CD

# 1. Когда запускать (Триггеры)
on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ] # Срабатывает при создании тегов версий v1.0.0
  pull_request:
    branches: [ "main" ]

# 2. Что именно делать (Задачи)
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"] # Раздел 5: Матрица тестирования
    
    steps:
      - name: Скачиваем код репозитория
        uses: actions/checkout@v4

      - name: Устанавливаем Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip' # Раздел 5: Включаем кэширование pip

      - name: Устанавливаем зависимостями
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Проверка кода линтером (Ruff)
        run: ruff check .

      - name: Запуск автотестов (Pytest)
        run: pytest

  build-and-push:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/') # Запускать ТОЛЬКО для релизных тегов
    runs-on: ubuntu-latest
    steps:
      - name: Скачиваем код
        uses: actions/checkout@v4

      - name: Логин в Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Получаем версию релиза (тег)
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Сборка и отправка Docker-образа
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/bmi-api:latest
            ${{ secrets.DOCKER_USERNAME }}/bmi-api:${{ env.VERSION }}
